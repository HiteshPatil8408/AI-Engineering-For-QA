name: Validate learning platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s local-labs/python -p 'test_*.py'
      - run: python -m pip install -r local-labs/requirements.txt
      - run: python -m pytest local-labs/tests local-labs/fastapi -q
      - run: python scripts/verify-solutions.py
      - run: python local-labs/evals/runner.py --output artifacts/evaluation
      - run: python local-labs/mcp/client.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            test-results/
            artifacts/evaluation/
            docs/CONTENT_INTEGRITY.json
